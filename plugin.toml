[plugin]
id = "e2e-test"
name = "E2E Test (do not install)"
version = "0.1.0"
description = "End-to-end test of the Astra plugins registry. Not a real plugin; it will be removed."
author = "mihailinl"
license = "MIT"

[entry]
command = "target/release/dice_roller"

[capabilities]
tools = true
actions = true
triggers = true

# `[capabilities]` above is what this plugin implements for Astra to call into.
# `[permissions]` is the other direction: which host RPCs the plugin may call
# out to. Default-deny — a manifest with no `[permissions]` section may call
# nothing beyond Register, PluginLog and GetPluginSelfConfig, so declaring
# `triggers = true` is not what lets `fire_trigger` through. This is.
[permissions]
fire_trigger = { reason = "Fires the on_roll_value trigger so your commands can react to what you rolled" }

[config]
schema = """
{
  "type": "object",
  "properties": {
    "default_sides": {
      "type": "number",
      "default": 6,
      "title": "Default Dice Sides"
    }
  }
}
"""
